<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:dv="http://typo3.org/ns/Slub/Dfgviewer/ViewHelpers"
      xmlns:dc="http://typo3.org/ns/Slub/SlubDigitalcollections/ViewHelpers"
      data-namespace-typo3-fluid="true" lang="en">

<dv:titleTag
    title="{dc:xpath(xpath:'(//mets:dmdSec/mets:mdWrap/mets:xmlData/mods:mods/mods:titleInfo[not(@type=\'alternative\')]/mods:nonSort | //mets:dmdSec/mets:mdWrap/mets:xmlData/mods:mods/mods:titleInfo[not(@type=\'alternative\')]/mods:title | //mets:dmdSec/mets:mdWrap/mets:xmlData/mods:mods/mods:titleInfo[not(@type=\'alternative\')]/mods:partNumber | //mets:dmdSec/mets:mdWrap/mets:xmlData/mods:mods/mods:titleInfo[not(@type=\'alternative\')]/mods:partName)')}"
/>

<script>
/* TEMPORAE DIAGNOSTIK (wird wieder entfernt): fruesher Monitor ab Navigation.
   Probiert jeden gerenderten Frame ab (ab dem ersten Paint) und loggt jede
   Geometrie-Veranderung der relevanten Elemente - auch VOR dem Probe-Script
   im Body. Ergebnis wird nach 15s als EARLY-PROBE-Zeile in der Konsole. */
(function () {
    var t0 = performance.now();
    var frames = [];
    var errors = [];
    var sels = [
        'ul.image-tools', '.view-functions', '.document-view', '.main-wrapper',
        '.document-functions', '.document-functions>ul', '.provider',
        '.tx-dlf-toolbox-fulltext-container', '.tx-dlf-toolbox-searchindocument',
        '.tx-dlf-toolbox-searchindocument-search-toggle', '#tx-dlf-toolbox-fulltext-selection',
        'div.tx-dlf-toolbox-searchindocument li', '.header-bar', '.control-bar'
    ];
    var lastSig = '##init##';
    var firstFrameLogged = false;
    function sample() {
        try {
            var o = {};
            var sig = '';
            for (var i = 0; i < sels.length; i++) {
                var el;
                try { el = document.querySelector(sels[i]); } catch (e) { el = null; }
                if (!el) { o[sels[i]] = 'abs'; sig += '|a'; continue; }
                if (el.getClientRects().length === 0) { o[sels[i]] = 'hid'; sig += '|h'; continue; }
                var r = el.getBoundingClientRect();
                var s = Math.round(r.top * 10) / 10 + ',' + Math.round(r.left * 10) / 10 + ' ' + Math.round(r.width) + 'x' + Math.round(r.height);
                o[sels[i]] = s;
                sig += '|' + s;
            }
            o.vw = innerWidth + 'x' + innerHeight;
            o.sy = Math.round(scrollY);
            o.cw = (document.documentElement || {}).clientWidth;
            try {
                var fte = document.getElementById('tx-dlf-toolbox-fulltext-selection');
                if (fte) {
                    o.fte = (getComputedStyle(fte).display) + ' ' + fte.offsetWidth + 'w [' + String(fte.textContent || '').slice(0, 40) + ']';
                    sig += '|' + o.fte;
                }
            } catch (e2) {}
            if (!firstFrameLogged) { try { o.cookies = String(document.cookie).slice(0, 200); } catch (e2) {} }
            sig += '|' + o.vw + '|' + o.sy + '|' + o.cw;
            var t = Math.round(performance.now() - t0);
            if (!firstFrameLogged) {
                firstFrameLogged = true;
                o.frame = 1;
                o.t = t;
                o.body = document.body ? document.body.className : 'pre-body';
                frames.push(o);
            } else if (sig !== lastSig) {
                o.frame = frames.length + 1;
                o.t = t;
                o.body = document.body ? document.body.className : 'pre-body';
                frames.push(o);
            } else { o.frame = frames.length; }
            lastSig = sig;
        } catch (e) { errors.push('sample: ' + e); }
    }
    (function loop() {
        if (performance.now() - t0 > 40000) {
            try {
                var dump = frames;
                if (frames.length > 40) {
                    dump = frames.slice(0, 30);
                    dump.push({ cut: frames.length - 40 + ' frames' });
                    dump = dump.concat(frames.slice(-10));
                }
                console.warn('EARLY-PROBE frames=' + frames.length + ' ' + JSON.stringify({ frames: dump, errors: errors }));
            } catch (e) {}
            return;
        }
        requestAnimationFrame(function () { sample(); loop(); });
    })();
    window.addEventListener('error', function (e) {
        errors.push((e.filename || '') + ':' + (e.lineno || '') + ' ' + (e.message || ''));
    });
})();
</script>

<div class="main-wrapper">
    <f:render section="ControlBar" partial="ControlBar" arguments="{_all}" />

    <f:if condition="{isAudio} == 1 OR {isVideo} == 1">
        <f:then>
            <f:render section="MediaView" partial="Kitodo/View/MediaView" arguments="{_all}" />
        </f:then>
        <f:else if="{is3dObject} == 1">
            <f:render section="ModelView" partial="Kitodo/View/ModelView" arguments="{_all}" />
        </f:else>
        <f:else if="{isCalendar} == 1">
            <f:render section="CalendarView" partial="Kitodo/View/CalendarView" arguments="{_all}" />
        </f:else>
        <f:else if="{isMultivolumeWork} == 1">
            <f:render section="MultivolumeWorkPageView" partial="Kitodo/View/MultivolumeWorkPageView" arguments="{_all}" />
        </f:else>
        <f:else>
            <f:render section="PageView" partial="Kitodo/View/PageView" arguments="{_all}" />
        </f:else>
    </f:if>
</div>

<f:if condition="{matomoIdsite}">
    <f:render section="Matomo" partial="Matomo" arguments="{_all}" />
</f:if>

</html>
